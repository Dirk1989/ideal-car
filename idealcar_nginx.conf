        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 50M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/idealcar.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idealcar.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.idealcar.co.za) {
        return 301 https://$host$request_uri;
    }

    if ($host = idealcar.co.za) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name 116.203.229.47 idealcar.co.za www.idealcar.co.za;
    return 404;
}

server {
    if ($host = admin.idealcar.co.za) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name admin.idealcar.co.za;
    return 404;
}
