server {
    server_name 116.203.229.47 idealcar.co.za www.idealcar.co.za;

    # Serve uploaded images directly without proxying to Next.js
    location /uploads/ {
        alias /var/www/idealcar/frontend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 50M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/idealcar.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idealcar.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name admin.idealcar.co.za;

    location = / {
        return 301 /admin;
    }

    # Serve uploaded images directly
    location /uploads/ {
        alias /var/www/idealcar/frontend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
